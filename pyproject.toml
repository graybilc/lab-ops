[project]
name = "lab-ops"
version = "0.1.0"
description = "Scientific Intelligence OS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "lancedb<0.15.0",
    "instructor>=1.17.0",
    "pydantic-ai>=2.38.0",
    "openai>=3.3.0",
    "pypdf>=6.20.0",
    "numpy>=1.26.0,<2.0.0",
    "pyarrow<17.0.0",
]

# It maps the terminal command `lab-ops` to the `app()` object inside `src/lab_ops/cli.py`
[project.scripts]
lab-ops = "lab_ops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=24.0.0",
    "pytest>=9.1.1",
]
